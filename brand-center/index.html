<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLIMAX · Brand Center / Brand Book Mestre</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=League+Spartan:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#0B5BA5;--navy:#042F4C;--navy2:#021F33;--ice:#8DE8F7;--paper:#F4F8F9;--line:#D9E5E9;--sidebar:310px;--display:"League Spartan",Arial,sans-serif;--body:"Inter",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:#102633;font:16px/1.55 var(--body)}button,input,select{font:inherit}.shell{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:linear-gradient(180deg,#021F33,#042F4C);color:#fff;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.09);z-index:50}.side-head{padding:24px 22px 18px;border-bottom:1px solid rgba(255,255,255,.09)}.brand{display:flex;align-items:center;gap:13px}.brand-icon{width:48px;height:48px;border-radius:13px;background:#fff;display:grid;place-items:center;overflow:hidden}.brand-icon img{width:132px;max-width:none}.brand strong{display:block;font:800 23px/1 var(--display);letter-spacing:.04em}.brand small{display:block;margin-top:4px;color:#A8C9D8}.version{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.version span{padding:6px 9px;border:1px solid rgba(255,255,255,.14);border-radius:999px;color:#BCD4DF;font-weight:700}.version .approved{background:rgba(141,232,247,.10);color:#DDFBFF;border-color:rgba(141,232,247,.35)}.search{padding:14px 14px 5px}.search input{width:100%;padding:12px 13px;border:1px solid rgba(255,255,255,.14);border-radius:11px;background:#062A44;color:#fff;outline:none}.search input::placeholder{color:#8FB1C3}.nav{padding:10px 10px 22px;overflow:auto}.nav button{width:100%;border:0;background:transparent;color:#fff;text-align:left;cursor:pointer;border-radius:13px;display:grid;grid-template-columns:38px 1fr;gap:10px;padding:12px 10px;margin:2px 0}.nav button>span{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#083453;color:#A6C8D7;font-weight:800}.nav b{display:block;font:700 17px/1.15 var(--display)}.nav small{display:block;margin-top:4px;color:#91B2C2}.nav button:hover,.nav button.active{background:rgba(255,255,255,.08)}.nav button.active>span{background:var(--ice);color:var(--navy2)}.side-foot{margin-top:auto;padding:16px 20px;border-top:1px solid rgba(255,255,255,.09);color:#9EBBC9}.content{margin-left:var(--sidebar);min-height:100vh;padding:24px}.toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:10px}.toolbar small{font-weight:800;color:#6E8692;letter-spacing:.1em}.toolbar h1{margin:2px 0 3px;font:700 31px var(--display)}.toolbar p{margin:0;color:#60717B}.focus{border:1px solid var(--line);background:#F8FBFC;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.reader{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.docframe{display:block;width:100%;height:calc(100vh - 135px);min-height:760px;border:0;background:#F4F8F9}.mobile{display:none}body.focus-mode .sidebar{display:none}body.focus-mode .content{margin-left:0;padding:10px}body.focus-mode .docframe{height:calc(100vh - 95px)}@media(max-width:820px){.sidebar{display:none}.content{margin-left:0;padding:12px}.mobile{display:flex;position:sticky;top:0;z-index:60;background:#021F33;color:#fff;padding:11px 13px;align-items:center;justify-content:space-between;gap:12px}.mobile b{font:800 18px var(--display)}.mobile select{max-width:60%;background:#062A44;color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:9px;padding:9px}.toolbar{align-items:flex-start}.docframe{height:82vh;min-height:650px}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
  <div class="side-head"><div class="brand"><div class="brand-icon"><img src="../assets/logos/ESCRITA%20AZUL%20SVG.svg" alt=""></div><div><strong>CLIMAX</strong><small>Brand Center Mestre</small></div></div><div class="version"><span class="approved">Sistema atual</span><span>HVAC</span><span>v2.0</span></div></div>
  <div class="search"><input id="navSearch" type="search" placeholder="Buscar seção..." aria-label="Buscar seção"></div>
  <nav class="nav">
    <button class="active" data-doc="brand-book" data-search="brand book estratégia fundamentos verbal visual mascote aplicações governança"><span>01</span><div><b>Brand Book Mestre</b><small>Estratégia, identidade e governança.</small></div></button>
    <button data-doc="downloads" data-search="biblioteca assets logos svg png mascotes downloads"><span>02</span><div><b>Biblioteca de assets</b><small>Masters oficiais e downloads.</small></div></button>
    <button data-doc="tokens" data-search="design tokens cores tipografia spacing radius shadow motion breakpoints css json"><span>03</span><div><b>Design Tokens</b><small>Fonte técnica CSS + JSON.</small></div></button>
    <button data-doc="ui-system" data-search="ui digital design system buttons inputs tabs chips status cards tables navigation modal alert loading chart"><span>04</span><div><b>UI / Design System</b><small>Componentes, estados e padrões.</small></div></button>
    <button data-doc="editorial" data-search="editorial conteúdo headline cta legenda case técnico microcopy canais"><span>05</span><div><b>Editorial & Conteúdo</b><small>Voz, templates e QA editorial.</small></div></button>
    <button data-doc="motion-production" data-search="motion production logo sting intro outro loading social cut 16 9 9 16"><span>06</span><div><b>Motion Production</b><small>Source, specs e formatos.</small></div></button>
    <button data-doc="production-templates" data-search="templates editáveis pptx docx html markdown social assinatura readme proposta relatório"><span>07</span><div><b>Templates editáveis</b><small>Masters de produção.</small></div></button>
  </nav>
  <div class="side-foot">CLIMAX Refrigeração<br>Brand Center · Fonte de verdade</div>
</aside>
<div class="mobile"><b>CLIMAX · BRAND CENTER</b><select id="mobileSelect"><option value="brand-book">Brand Book</option><option value="downloads">Assets</option><option value="tokens">Tokens</option><option value="ui-system">UI System</option><option value="editorial">Editorial</option><option value="motion-production">Motion</option><option value="production-templates">Templates</option></select></div>
<main class="content">
  <div class="toolbar"><div><small>BRAND CENTER / BRAND BOOK MESTRE</small><h1 id="title">Brand Book Mestre</h1><p id="desc">Estratégia, identidade visual, linguagem, aplicações e governança.</p></div><button class="focus" id="focusBtn">Modo foco</button></div>
  <div class="reader"><iframe id="frame" class="docframe" src="sections/brand-book.html" title="Brand Book Mestre"></iframe></div>
</main>
</div>
<script>
const meta={
 "brand-book":["Brand Book Mestre","Estratégia, identidade visual, linguagem, aplicações e governança."],
 "downloads":["Biblioteca oficial de assets","Masters oficiais, arquivos de produção e downloads."],
 "tokens":["Design Tokens","Cores, tipografia, spacing, radius, shadows, motion e breakpoints."],
 "ui-system":["UI / Digital Design System","Componentes, estados, padrões e comportamento digital."],
 "editorial":["Sistema editorial e conteúdo","Voz, hierarquia, CTAs, formatos, canais e QA editorial."],
 "motion-production":["Pacote de motion para produção","Logo sting, intro, outro, loading e social cutdowns."],
 "production-templates":["Templates realmente editáveis","PPTX, DOCX, HTML e Markdown para produção real."]
};
const frame=document.getElementById("frame"),title=document.getElementById("title"),desc=document.getElementById("desc"),mobile=document.getElementById("mobileSelect");
function go(id){frame.src="sections/"+id+".html";title.textContent=meta[id][0];desc.textContent=meta[id][1];document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.doc===id));mobile.value=id}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.doc)));mobile.addEventListener("change",()=>go(mobile.value));
document.getElementById("navSearch").addEventListener("input",e=>{const q=e.target.value.toLowerCase().trim();document.querySelectorAll(".nav button").forEach(b=>b.style.display=!q||(b.textContent+" "+b.dataset.search).toLowerCase().includes(q)?"grid":"none")});
document.getElementById("focusBtn").addEventListener("click",e=>{document.body.classList.toggle("focus-mode");e.target.textContent=document.body.classList.contains("focus-mode")?"Sair do foco":"Modo foco"});
</script>
</body></html>
