name: CLIMAX / Brand Studio Visual QA
on:
  pull_request:
    paths:
      - 'brand-center/post-studio/**'
      - 'brand-center/sections/audio-production.html'
      - 'brand-center/audio-studio.*'
      - 'brand-center/data/audio-production.json'
      - 'assets/**'
      - 'scripts/visual-qa/**'
      - '.github/workflows/climax-visual-qa.yml'
  workflow_dispatch:
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: npm install --prefix scripts/visual-qa --no-audit --no-fund
      - name: Instalar Chromium
        run: cd scripts/visual-qa && npx playwright install chromium --with-deps
      - name: Iniciar servidor estático
        run: python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/climax-static.log 2>&1 &
      - name: Validar 7 formatos e exportações
        run: npm test --prefix scripts/visual-qa
      - name: Validar Estúdio de Áudio em desktop e mobile
        run: cd scripts/visual-qa && node audio-qa.mjs
      - name: Salvar capturas e exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climax-studio-visual-qa
          path: scripts/visual-qa/out/
          if-no-files-found: warn
          retention-days: 7
