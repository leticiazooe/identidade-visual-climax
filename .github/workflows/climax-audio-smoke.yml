name: CLIMAX / Audio Layer Smoke Test
on:
  pull_request:
    paths:
      - 'motion/remotion/**'
      - 'brand-center/data/audio-production.json'
      - '.github/workflows/climax-audio-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: motion/remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências e sincronizar masters
        run: |
          npm install --no-audit --no-fund
          npm run assets:sync
      - name: Instalar FFmpeg para teste de áudio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Criar tom de teste sintético (não é voz gerada)
        run: |
          mkdir -p public/audio/mix
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=440:duration=3' -ac 2 -ar 48000 -c:a pcm_s24le public/audio/mix/final-mix.wav
          printf '%s' '{"variant":"wide","audioMode":"master","musicEnabled":false,"soundEffectsEnabled":false}' > audio-ci-props.json
          npm run audio:check -- --master
      - name: Render curto com áudio mestre
        run: npx remotion render src/index.ts CLIMAX-Film-16x9 out/audio-smoke.mp4 --frames=0-89 --scale=0.25 --codec=h264 --props=./audio-ci-props.json
      - name: Verificar trilha no MP4
        run: |
          test -s out/audio-smoke.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 out/audio-smoke.mp4 | grep -E 'aac|mp3|opus'
          echo 'PASS: AudioTimeline renderizou um vídeo com áudio.'
      - name: Testar trilha original e filme final com voz sintética
        run: |
          mkdir -p public/audio/voice
          for scene in scene-01-signature scene-02-problem scene-03-diagnosis scene-04-care scene-05-flow scene-06-solutions scene-07-proof scene-08-outro; do
            ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=523:duration=2' -ar 44100 -ac 1 public/audio/voice/${scene}.mp3
          done
          node --input-type=module -e "import fs from 'node:fs'; import {spawnSync} from 'node:child_process'; const s=JSON.parse(fs.readFileSync('../../brand-center/data/sound-design.json')); fs.mkdirSync('public/audio/sfx',{recursive:true}); for(const a of s.assets){const r=spawnSync('ffmpeg',['-hide_banner','-loglevel','error','-y','-f','lavfi','-i','sine=frequency=450:duration='+a.durationSeconds,'-ar','44100','public/audio/sfx/'+a.filename],{stdio:'inherit'});if(r.status!==0)process.exit(1)}"
          npm run sfx:plan
          npm run sfx:check -- --files
          npm run music:generate
          npm run final:render -- --format=wide --music=original --music-volume=0.16 --sfx=on --sfx-volume=0.75 --smoke
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 out/climax-final-16x9-smoke.mp4 | grep -x 'aac'
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 out/climax-final-16x9-smoke.mp4 | grep -x 'h264'
          echo 'PASS: MP4 final contém vídeo e áudio.'
      - name: Salvar vídeo de smoke test
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: climax-audio-smoke
          path: |
            motion/remotion/out/audio-smoke.mp4
            motion/remotion/out/climax-final-16x9-smoke.mp4
          retention-days: 3
