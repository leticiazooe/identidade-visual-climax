name: CLIMAX Motion / Remotion
on:
  pull_request:
    paths:
      - 'motion/remotion/**'
      - '.github/workflows/climax-remotion.yml'
  workflow_dispatch:
    inputs:
      render_video:
        description: 'Renderizar MP4 horizontal e vertical e publicar como artefatos?'
        required: true
        default: false
        type: boolean
jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: motion/remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar storyboard e assets
        run: npm run validate
      - name: Validar roteiro de voz e CLI sem consumir créditos
        run: |
          npm run voice:plan
          npm run audio:check
          node --check scripts/voice-cli.mjs
          node --check scripts/prepare-audition.mjs
          node --check scripts/render-audio.mjs
      - name: Typecheck TypeScript
        run: npx tsc --noEmit
      - name: Renderizar 16:9
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.render_video)
        run: npm run render:wide
      - name: Renderizar 9:16
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.render_video)
        run: npm run render:vertical
      - name: Publicar arquivos MP4
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.render_video)
        uses: actions/upload-artifact@v4
        with:
          name: climax-motion-mp4
          path: motion/remotion/out/*.mp4
          if-no-files-found: error
          retention-days: 14
